name: Update Railway Bounties

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-bounties:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: |
          python scripts/scrape_railway_bounties.py
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet public/railway-bounties.json || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/railway-bounties.json
          git commit -m "chore: update Railway bounties data [skip ci]"
          git push
      
      - name: Summary
        run: |
          if [ "${{ steps.scrape.outcome }}" == "success" ]; then
            echo "✅ Scraping completed successfully" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
              echo "📝 Changes detected and committed" >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ No changes detected" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Scraping failed, but existing data was preserved" >> $GITHUB_STEP_SUMMARY
          fi
